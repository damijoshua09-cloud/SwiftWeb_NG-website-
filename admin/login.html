<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — SwiftWeb NG</title>
<link rel="stylesheet" href="admin.css">
</head>
<body class="auth-body">

  <div class="auth-card">
    <div class="auth-brand">
      <span class="brand-mark">⌁</span>
      <span class="brand-name">SwiftWeb<span class="brand-ng">NG</span></span>
    </div>
    <p class="auth-subtitle">Admin Dashboard</p>

    <form id="loginForm" class="auth-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <p class="auth-error" id="loginError" role="alert"></p>
      <button type="submit" class="btn-primary btn-block" id="loginBtn">Log In</button>
    </form>
  </div>

  <script src="login.js"></script>
</body>
</html>
